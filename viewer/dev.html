<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOREST — dev viewer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0b0d; color: #cfd2d8; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         height: 100vh; display: grid; grid-template-rows: 34px 1fr; overflow: hidden; }
  #tabs { display: flex; gap: 2px; padding: 4px 8px 0; background: #0f0f12; border-bottom: 1px solid #222; }
  #tabs button { background: #16161b; border: 1px solid #2a2a31; border-bottom: 0; color: #8b949e; padding: 6px 16px; font: inherit; cursor: pointer; border-radius: 6px 6px 0 0; }
  #tabs button.active { background: #1d1d24; color: #e6e8ec; }
  .tab { display: none; min-height: 0; overflow: hidden; }
  .tab.active { display: grid; }
  #single { grid-template-columns: 300px 1fr 220px; }
  #ab { grid-template-columns: 260px 1fr 260px 1fr; }
  #grid, #forest { grid-template-columns: 300px 1fr; }
  .panel, .side { overflow-y: auto; padding: 12px; background: #111114; border-right: 1px solid #222; min-height: 0; }
  .side { border-right: 0; border-left: 1px solid #222; }
  .stage { display: grid; place-items: center; min-width: 0; min-height: 0; padding: 12px; overflow: hidden; }
  .stage canvas { width: min(100%, calc(100vh - 60px)); aspect-ratio: 1; display: block; background: #000; cursor: grab; }
  .stage.ab { grid-template-rows: 1fr auto; }
  .stage.ab canvas { width: min(100%, calc(100vh - 140px)); }
  .stage.ab .thumbrow { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  .stage.ab img { width: 72px; height: 72px; image-rendering: pixelated; background: #000; }
  .stage.ab pre { margin: 0; color: #8b949e; font: inherit; }
  h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #7d8590; margin: 16px 0 6px; }
  .panel h2:first-child { margin-top: 0; }
  label { display: grid; grid-template-columns: 104px 1fr 44px; gap: 6px; align-items: center; margin: 3px 0; }
  label.wide { grid-template-columns: 60px 1fr; }
  label.range { grid-template-columns: 96px 1fr 62px; }
  .pair { display: grid; gap: 1px; }
  .pair input { height: 12px; margin: 0; }
  input[type=range] { width: 100%; }
  input[type=text], select { width: 100%; background: #1a1a1f; color: inherit; border: 1px solid #2c2c33; padding: 3px 5px; font: inherit; }
  button { background: #1d1d24; color: inherit; border: 1px solid #33333c; padding: 4px 8px; font: inherit; cursor: pointer; }
  button:hover { background: #292932; }
  .row { display: flex; gap: 6px; margin: 4px 0; flex-wrap: wrap; }
  .val { text-align: right; color: #8b949e; font-size: 11px; }
  .swatches { display: grid; grid-template-columns: repeat(9, 1fr); height: 16px; margin: 6px 0; }
  #thumb { width: 100%; aspect-ratio: 1; image-rendering: pixelated; display: block; background: #000; }
  #stats { white-space: pre-wrap; color: #8b949e; margin-top: 8px; }
  kbd { border: 1px solid #333; padding: 0 4px; border-radius: 3px; }
  #tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 8px; min-height: 0; overflow: hidden; }
  .tile { display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; min-height: 0; min-width: 0; }
  .tile canvas { height: 100%; width: auto; max-width: 100%; aspect-ratio: 1; display: block; background: #000; cursor: grab; }
  .tile .cap { display: flex; gap: 6px; align-items: center; color: #8b949e; font-size: 11px; padding: 3px 2px; white-space: nowrap; overflow: hidden; width: 100%; min-width: 0; }
  .tile .cap span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tile .cap button { padding: 1px 6px; font-size: 11px; }
  .hidden { display: none !important; }
  .stage.forest { grid-template-rows: 1fr auto; }
  .stage.forest canvas { width: min(100%, calc(100vh - 110px)); }
  #legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 10px; width: min(100%, calc(100vh - 110px)); margin-top: 6px; }
  #legend .cap { display: flex; gap: 6px; align-items: center; color: #8b949e; font-size: 11px; white-space: nowrap; overflow: hidden; min-width: 0; }
  #legend .cap span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #legend .cap button { padding: 1px 6px; font-size: 11px; }
  .tile .cap button { padding: 1px 6px; font-size: 11px; }
  @media (max-width: 900px) { body { height: auto; overflow: auto; } .tab.active { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div id="tabs">
    <button data-tab="single">Viewer</button>
    <button data-tab="ab">A / B</button>
    <button data-tab="grid">Grid 3×3</button>
    <button data-tab="forest">Forest</button>
  </div>
  <div id="single" class="tab"></div>
  <div id="ab" class="tab"></div>
  <div id="grid" class="tab"></div>
  <div id="forest" class="tab"></div>
  <script type="module" src="./dev/ui.js"></script>
</body>
</html>
